apply plugin: 'com.android.application'

android {
    namespace = "com.cam.ai"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.cam.ai"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "2.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            noCompress "tflite"
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (!project.hasProperty("includeX86")) {
                ndk {
                    abiFilters 'arm64-v8a', 'armeabi-v7a'
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"

    // CameraX (Saf Native Donanım Kamerası)
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // Google MediaPipe Tasks Vision (Cihaz İçi Saf Native AI Motoru)
    implementation 'com.google.mediapipe:tasks-vision:0.10.29'

    // NanoHTTPD (Yerel Ultra Hızlı Canlı Kamera & İzleyici Yayını)
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // Guava (CameraX ListenableFuture)
    implementation 'com.google.guava:guava:31.1-android'

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
